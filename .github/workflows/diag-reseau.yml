name: Diagnostic reseau (essai en vrai)
on:
  push:
    branches: [diag-reseau]
jobs:
  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Simulateur
        run: tar -xJf diag/sim.tar.xz && cd wsim && sh buildnet.sh t_net.c r_net
      - name: Essais
        env:
          ASAN_OPTIONS: detect_leaks=0
          SIM_GW: 127.0.0.53
        run: cd wsim && (timeout 2400 ./t_net_r > net.log 2>&1 || true) && grep -E "RESULTAT|FIN|^==|pas de radio" net.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-log
          path: wsim/net.log
