name: Test des touches (long, limites GameCube)

# Le test des touches de GC Station (START > Réglages > Outils > Test de la console > Z, 3 h) lancé à la main dans le
# simulateur, avec les limites de la GameCube (mémoire : taille du vrai .dol de la release « dernier » ; processeur 12 fois
# plus lent ; carte SD, réseau, écran 50 Hz PAL comme la console). Le rapport (test-console.txt) et le résumé du simulateur
# sont écrits dans le journal du travail (et en artefact).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée du test (minutes)"
        default: "180"

permissions:
  contents: read

jobs:
  touches:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Outils (clang, ffmpeg, Pillow)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm ffmpeg python3-pil curl >/dev/null

      - name: Bibliothèques (en cache)
        uses: actions/cache@v4
        with:
          path: |
            tools/pc-sim/work/src
            tools/pc-sim/work/libs
          key: pcsim-libs-${{ hashFiles('tools/pc-sim/fetch.sh') }}

      - name: Test des touches
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ github.event.inputs.minutes }}
        run: |
          set -u
          R=$(pwd); P=$R/tools/pc-sim; RUN=$P/work/run; OUT=$RUN/long
          [ -d $P/work/libs/mbedtls ] || sh $P/fetch.sh
          make -s -C $P -j"$(nproc)"
          mkdir -p $RUN $OUT
          ID=$(gh api repos/${{ github.repository }}/releases/tags/dernier --jq '.assets[] | select(.name|endswith(".dol")) | .id' | head -1)
          gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/$ID > $P/work/gc.dol
          ls -l $P/work/gc.dol
          [ -d "$RUN/sd:/mp3" ] || sh $P/demo-sd.sh $RUN
          # scenario : celui du test court, attente portee a la duree du test + 10 min
          sed "s/^wait 500s$/wait $(( MIN * 60 + 600 ))s/" $P/scenarios/test-touches.txt > $OUT/scenario.txt
          echo quit >> $OUT/scenario.txt
          KTR="$RUN/sd:/gc-mp3/journaux/test-console.txt"; rm -f "$KTR"
          cd $RUN
          code=0
          PCSIM_DOL=$P/work/gc.dol PCSIM_PAL=1 PCSIM_COMPOSANTE=1 PCSIM_KT_MIN=$MIN PCSIM_SCRIPT=$OUT/scenario.txt PCSIM_OUT=$OUT \
            timeout $(( MIN * 60 + 1200 )) $P/gcstation > $OUT/log.txt 2>&1 || code=$?
          echo "=== code de sortie : $code ==="
          echo "=== rapport (test-console.txt) ==="
          if [ -f "$KTR" ]; then cp "$KTR" $OUT/; cat "$KTR"; else echo "PAS DE RAPPORT"; fi
          echo "=== simulateur (resume) ==="
          grep -E "\[pcsim\] (GameCube|processeur|memoire|fluidite|son)" $OUT/log.txt || true
          echo "=== fin du journal ==="
          tail -60 $OUT/log.txt
          for f in "$RUN/sd:/gc-mp3/journaux/"*; do echo "=== $(basename "$f") ==="; tail -80 "$f"; done 2>/dev/null || true

      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-touches-long
          path: tools/pc-sim/work/run/long
          retention-days: 14
