name: Compiler GC MP3 Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger minimp3.h
        run: curl --fail --location --silent --show-error -o source/minimp3.h https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h

      - name: Compiler
        run: |
          make clean
          make

      - name: Vérifier le DOL généré
        run: |
          python3 - <<'PY'
          import os, struct, sys
          path = "gc-mp3player.dol"
          data = open(path, "rb").read()
          size = len(data)
          if size < 0x100:
              sys.exit(f"ERREUR: DOL trop petit ou en-tête incomplet: {size} octets")
          text_off = struct.unpack_from(">7I", data, 0x00)
          data_off = struct.unpack_from(">11I", data, 0x1C)
          text_addr = struct.unpack_from(">7I", data, 0x48)
          data_addr = struct.unpack_from(">11I", data, 0x64)
          text_size = struct.unpack_from(">7I", data, 0x90)
          data_size = struct.unpack_from(">11I", data, 0xAC)
          bss_addr, bss_size, entry = struct.unpack_from(">3I", data, 0xD8)
          sections = []
          for kind, offs, addrs, sizes in (("text", text_off, text_addr, text_size), ("data", data_off, data_addr, data_size)):
              for i, (off, addr, length) in enumerate(zip(offs, addrs, sizes)):
                  if length == 0:
                      continue
                  if off < 0x100 or off + length > size:
                      sys.exit(f"ERREUR: section {kind}[{i}] hors fichier")
                  if off % 4 or addr % 4 or length % 4:
                      sys.exit(f"ERREUR: section {kind}[{i}] non alignée")
                  if addr < 0x80000000 or addr + length > 0x81800000:
                      sys.exit(f"ERREUR: section {kind}[{i}] hors MEM1")
                  sections.append((kind, i, addr, addr + length))
          if not sections:
              sys.exit("ERREUR: aucune section DOL valide")
          if not any(k == "text" and start <= entry < end for k, i, start, end in sections):
              sys.exit(f"ERREUR: point d'entrée {entry:#010x} hors section texte")
          for a, b in zip(sorted(sections, key=lambda s: s[2]), sorted(sections, key=lambda s: s[2])[1:]):
              if a[3] > b[2]:
                  sys.exit(f"ERREUR: chevauchement mémoire entre {a[:2]} et {b[:2]}")
          print(f"DOL valide: {size} octets; entrée {entry:#010x}; {len(sections)} sections")
          PY

      - name: Publier le .dol
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3player
          path: gc-mp3player.dol
