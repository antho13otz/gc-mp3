name: Compiler GC MP3 Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger minimp3.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/minimp3.h \
            https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h

      # Decodeur JPEG/PNG pour les pochettes (version figee, testee)
      - name: Télécharger stb_image.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/stb_image.h \
            https://raw.githubusercontent.com/nothings/stb/a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d/stb_image.h

      # Bibliotheque HTTPS (mbedTLS 3.6.7, archive officielle verifiee)
      - name: Télécharger mbedTLS
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o mbedtls.tar.bz2 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
          H=a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
          echo "$H  mbedtls.tar.bz2" | sha256sum -c -
          rm -rf mbedtls mbedtls-3.6.7
          python3 -c "import tarfile; tarfile.open('mbedtls.tar.bz2').extractall('.')"
          mv mbedtls-3.6.7 mbedtls
          ls mbedtls/library/*.c | wc -l

      # Decodeur AAC / HE-AAC pour les webradios (Helix, RealNetworks, licence RPSL),
      # version figee de la bibliotheque ESP8266Audio, empreinte verifiee
      - name: Télécharger le décodeur AAC (Helix)
        run: |
          C=e1f2a1a34aa460f5cca7a60b69d9a350fd099938
          B=https://raw.githubusercontent.com/earlephilhower/ESP8266Audio/$C/src/libhelix-aac
          F="aaccommon.h aacdec.c aacdec.h aactabs.c assembly.h bitstream.c \
             bitstream.h buffers.c coder.h dct4.c decelmnt.c dequant.c fft.c \
             filefmt.c huffmanaac.c hufftabs.c imdct.c noiseless.c pns.c sbr.c \
             sbr.h sbrfft.c sbrfreq.c sbrhfadj.c sbrhfgen.c sbrhuff.c \
             sbrimdct.c sbrmath.c sbrqmf.c sbrside.c sbrtabs.c statname.h \
             stproc.c tns.c trigtabs.c"
          mkdir -p helix
          for f in $F; do
            curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 -o helix/$f $B/$f
          done
          H=$(for f in $F; do cat helix/$f; done | sha256sum | cut -d' ' -f1)
          test "$H" = "cee275f6970b6f458f4b4d1e2d42b976fc3abad99d262d7e25b1ccc614a69ff2"

      # Decodeurs FLAC (dr_flac) et OGG Vorbis (stb_vorbis), domaine public,
      # versions figees, empreintes verifiees
      - name: Télécharger les décodeurs FLAC et OGG
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/dr_flac.h \
            https://raw.githubusercontent.com/mackron/dr_libs/dfe8377631000664666519fdb83da193fd8037f4/dr_flac.h
          echo "111144e778f55738db6851cb226015c419e00d04b916a09506d4856d9cff945c  source/dr_flac.h" | sha256sum -c -
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/stb_vorbis.c \
            https://raw.githubusercontent.com/nothings/stb/a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d/stb_vorbis.c
          echo "4c7cb2ff1f7011e9d67950446b7eb9ca044f2e464d76bfbb0b84dd2e23e65636  source/stb_vorbis.c" | sha256sum -c -

      # Certificats racines pour les sites https:// (liste Mozilla)
      - name: Générer source/cacert.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o cacert.pem https://curl.se/ca/cacert.pem \
            || cp /etc/ssl/certs/ca-certificates.crt cacert.pem
          python3 tools/pem2h.py cacert.pem source/cacert.h

      - name: Compiler
        run: |
          make clean
          make -j"$(nproc)"

      # Swiss lit les DOL par blocs de 128 Kio : on complete le fichier
      # jusqu'a un bloc entier (le chargeur ignore ces octets).
      - name: Aligner le DOL sur les blocs de lecture Swiss
        run: |
          python3 - <<'PY'
          import os
          path = "gc-mp3player.dol"
          block = 131072
          if not os.path.isfile(path):
              raise SystemExit("ERREUR: DOL absent")
          size = os.path.getsize(path)
          if size < 0x100:
              raise SystemExit("ERREUR: DOL trop petit")
          padded = ((size + block - 1) // block) * block
          with open(path, "ab") as f:
              f.write(b"\0" * (padded - size))
          print("DOL aligne:", size, "->", padded)
          PY

      - name: Vérifier le DOL généré
        run: |
          python3 - <<'PY'
          import struct, sys
          data = open("gc-mp3player.dol", "rb").read()
          size = len(data)
          if size < 0x100 or size % 131072:
              sys.exit("ERREUR: taille DOL invalide")
          def u(fmt, off):
              return struct.unpack_from(fmt, data, off)
          t_off, d_off = u(">7I", 0x00), u(">11I", 0x1C)
          t_adr, d_adr = u(">7I", 0x48), u(">11I", 0x64)
          t_len, d_len = u(">7I", 0x90), u(">11I", 0xAC)
          entry = u(">3I", 0xD8)[2]
          secs = []
          groups = (("text", t_off, t_adr, t_len),
                    ("data", d_off, d_adr, d_len))
          for kind, offs, adrs, lens in groups:
              for i in range(len(offs)):
                  off, adr, n = offs[i], adrs[i], lens[i]
                  if n == 0:
                      continue
                  if off < 0x100 or off + n > size:
                      sys.exit("ERREUR: section hors fichier")
                  if off % 4 or adr % 4 or n % 4:
                      sys.exit("ERREUR: section non alignee")
                  if adr < 0x80000000 or adr + n > 0x81800000:
                      sys.exit("ERREUR: section hors memoire")
                  secs.append((kind, adr, adr + n))
          if not secs:
              sys.exit("ERREUR: aucune section")
          ok = [s for s in secs if s[0] == "text"]
          if not any(a <= entry < b for k, a, b in ok):
              sys.exit("ERREUR: point d'entree invalide")
          secs.sort(key=lambda s: s[1])
          for a, b in zip(secs, secs[1:]):
              if a[2] > b[1]:
                  sys.exit("ERREUR: sections qui se chevauchent")
          print("DOL valide:", size, "octets,", len(secs), "sections")
          PY

      - name: Publier le .dol
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3player
          path: gc-mp3player.dol
