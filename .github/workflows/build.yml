name: Compiler GC MP3 Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger minimp3.h
        run: curl -fsSL -o source/minimp3.h https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h

      - name: Nettoyer et compiler
        run: |
          make clean
          make

      - name: Vérifier le DOL
        run: |
          python3 - <<'PY'
          import os, struct
          p = 'gc-mp3player.dol'
          if not os.path.isfile(p):
              raise SystemExit('ERREUR : gc-mp3player.dol absent')
          b = open(p, 'rb').read()
          if len(b) < 0x100:
              raise SystemExit('ERREUR : DOL trop petit')
          # DOL header: 7 text offsets, 11 data offsets, then addresses/sizes.
          text_off = struct.unpack('>7I', b[0:28])
          data_off = struct.unpack('>11I', b[28:72])
          text_addr = struct.unpack('>7I', b[72:100])
          data_addr = struct.unpack('>11I', b[100:144])
          text_sz = struct.unpack('>7I', b[144:172])
          data_sz = struct.unpack('>11I', b[172:216])
          entry = struct.unpack('>I', b[0xE0:0xE4])[0]
          sections = []
          for off, addr, size in zip(text_off + data_off, text_addr + data_addr, text_sz + data_sz):
              if size == 0:
                  continue
              if off < 0x100 or off + size > len(b):
                  raise SystemExit(f'ERREUR : section hors fichier offset={off:#x} size={size:#x}')
              if addr < 0x80000000 or addr + size > 0x81800000:
                  raise SystemExit(f'ERREUR : adresse section hors MEM1 addr={addr:#x} size={size:#x}')
              sections.append((addr, addr + size))
          if not sections or not any(start <= entry < end for start, end in sections[:7]):
              raise SystemExit(f'ERREUR : point d’entrée invalide {entry:#x}')
          print(f'DOL structurellement valide : {len(b)} octets ; entrée {entry:#010x} ; {len(sections)} sections')
          PY

      - name: Publier le .dol
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3player
          path: gc-mp3player.dol
