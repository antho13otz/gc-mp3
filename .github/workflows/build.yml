name: Compiler GC MP3 Player

on:
  push:
  workflow_dispatch:

# publication de la release "dernier" (mise a jour en un clic)
permissions:
  contents: write

# une compilation a la fois (la plus recente l'emporte)
concurrency:
  group: gc-mp3-build

jobs:
  # v44 : lanceur de jeux GC-MP3 = moteur de Swiss (GPL v2, version figee) modifie par
  # tools/mkloader.py. Recompile seulement si le script ou la version de Swiss changent.
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ghcr.io/extremscorner/libogc2:latest
    env:
      SWISS_COMMIT: 99b59e7a042cb5633cd341d86b7b92a65cd39851
    steps:
      - uses: actions/checkout@v4
        with:
          path: gcmp3

      - name: Lanceur déjà compilé ?
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            gc-mp3-loader.bin
            gc-mp3-igr.img
          key: loader2-${{ env.SWISS_COMMIT }}-${{ hashFiles('gcmp3/tools/mkloader.py', 'gcmp3/tools/loader/**') }}

      - name: Installer les outils de Swiss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -t bookworm-backports 7zip gcc gcc-mingw-w64-i686 libc6-dev libc6-i386 xorriso
          sudo dkp-pacman -Sy
          sudo dkp-pacman -S --noconfirm --ask 4 ppc-libiconv-lite

      - name: Télécharger Swiss
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: emukidid/swiss-gc
          ref: ${{ env.SWISS_COMMIT }}
          path: swiss
          fetch-depth: 0
          submodules: true

      - name: Compiler le lanceur
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/swiss"
          python3 gcmp3/tools/mkloader.py swiss gcmp3/tools/loader
          cd swiss
          set +e
          make compile-patches compile compile-packer > ../swiss-build.log 2>&1
          st=$?
          set -e
          tail -n 40 ../swiss-build.log
          if [ $st -ne 0 ]; then
            grep -n -i "error\|undefined" ../swiss-build.log | head -n 25 | sed 's/^/::error::/'
            exit $st
          fi
          cp cube/packer/swiss.dol ../gc-mp3-loader.bin
          # v45 : retour en jeu (A + Z + START) : le meme lanceur, dans un apploader.img
          # (reboot.dol du packer de Swiss + dol2ipl.py, comme l'apploader.img officiel)
          python3 buildtools/dol2ipl.py ../gc-mp3-igr.img cube/packer/reboot.dol "*gc-mp3-b0"
          ls -la ../gc-mp3-loader.bin ../gc-mp3-igr.img

      - name: Vérifier le lanceur
        run: |
          python3 - <<'PY'
          import struct, sys
          d = open("gc-mp3-loader.bin", "rb").read()
          e = struct.unpack_from(">I", d, 0xE0)[0]
          ok = False
          for i in range(18):
              off, adr, n = [struct.unpack_from(">I", d, b + i * 4)[0] for b in (0, 0x48, 0x90)]
              if not n:
                  continue
              if off < 0x100 or off + n > len(d) or adr < 0x80000000 or adr + n > 0x81800000:
                  sys.exit("ERREUR: section invalide")
              if i < 7 and adr <= e < adr + n and d[off + e + 4 - adr:off + e + 8 - adr] == b"_arg":
                  ok = True
          if not ok or len(d) > 8 * 1024 * 1024:
              sys.exit("ERREUR: lanceur invalide (point d'entree / _arg / taille)")
          print("lanceur valide :", len(d), "octets")
          PY

      - name: Publier le lanceur
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3-loader
          path: |
            gc-mp3-loader.bin
            gc-mp3-igr.img

  build:
    needs: loader
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger minimp3.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/minimp3.h \
            https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h

      # Decodeur JPEG/PNG pour les pochettes (version figee, testee)
      - name: Télécharger stb_image.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/stb_image.h \
            https://raw.githubusercontent.com/nothings/stb/a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d/stb_image.h

      # Bibliotheque HTTPS (mbedTLS 3.6.7, archive officielle verifiee)
      - name: Télécharger mbedTLS
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o mbedtls.tar.bz2 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
          H=a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
          echo "$H  mbedtls.tar.bz2" | sha256sum -c -
          rm -rf mbedtls mbedtls-3.6.7
          python3 -c "import tarfile; tarfile.open('mbedtls.tar.bz2').extractall('.')"
          mv mbedtls-3.6.7 mbedtls
          ls mbedtls/library/*.c | wc -l

      # Decodeur AAC / HE-AAC pour les webradios (Helix, RealNetworks, licence RPSL),
      # version figee de la bibliotheque ESP8266Audio, empreinte verifiee
      - name: Télécharger le décodeur AAC (Helix)
        run: |
          C=e1f2a1a34aa460f5cca7a60b69d9a350fd099938
          B=https://raw.githubusercontent.com/earlephilhower/ESP8266Audio/$C/src/libhelix-aac
          F="aaccommon.h aacdec.c aacdec.h aactabs.c assembly.h bitstream.c \
             bitstream.h buffers.c coder.h dct4.c decelmnt.c dequant.c fft.c \
             filefmt.c huffmanaac.c hufftabs.c imdct.c noiseless.c pns.c sbr.c \
             sbr.h sbrfft.c sbrfreq.c sbrhfadj.c sbrhfgen.c sbrhuff.c \
             sbrimdct.c sbrmath.c sbrqmf.c sbrside.c sbrtabs.c statname.h \
             stproc.c tns.c trigtabs.c"
          mkdir -p helix
          for f in $F; do
            curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 -o helix/$f $B/$f
          done
          H=$(for f in $F; do cat helix/$f; done | sha256sum | cut -d' ' -f1)
          test "$H" = "cee275f6970b6f458f4b4d1e2d42b976fc3abad99d262d7e25b1ccc614a69ff2"

      # Decodeurs FLAC (dr_flac) et OGG Vorbis (stb_vorbis), domaine public,
      # versions figees, empreintes verifiees
      - name: Télécharger les décodeurs FLAC et OGG
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/dr_flac.h \
            https://raw.githubusercontent.com/mackron/dr_libs/dfe8377631000664666519fdb83da193fd8037f4/dr_flac.h
          echo "111144e778f55738db6851cb226015c419e00d04b916a09506d4856d9cff945c  source/dr_flac.h" | sha256sum -c -
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o source/stb_vorbis.c \
            https://raw.githubusercontent.com/nothings/stb/a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d/stb_vorbis.c
          echo "4c7cb2ff1f7011e9d67950446b7eb9ca044f2e464d76bfbb0b84dd2e23e65636  source/stb_vorbis.c" | sha256sum -c -

      # Musique retro : game-music-emu 0.6.5 (SPC, NSF, GBS, VGM, HES, KSS, AY, SAP)
      # et libxmp 4.7.4 complete (plus de 50 formats). Archives figees ; seuls les
      # fichiers utiles sont extraits puis verifies (empreinte dans le script).
      - name: Télécharger les lecteurs de musique rétro (gme, libxmp) et le décodeur WebP
        run: |
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 -o gme.tar.gz \
            https://github.com/libgme/game-music-emu/archive/9e23d10f9fd2a6a2f33b10912dd8dc7153258995.tar.gz
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 -o xmp.tar.gz \
            https://github.com/libxmp/libxmp/archive/5d4f6aa2c7dcdf8e9cd8129fe579d45b36a302da.tar.gz
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 -o webp.tar.gz \
            https://github.com/webmproject/libwebp/archive/4fa21912338357f89e4fd51cf2368325b59e9bd9.tar.gz
          python3 tools/fetch_libs.py gme.tar.gz xmp.tar.gz webp.tar.gz

      # Generateur de QR code (onglet TELEPHONE), licence MIT, version figee
      - name: Télécharger qrcodegen
        run: |
          B=https://raw.githubusercontent.com/nayuki/QR-Code-generator/3c6d0b3cefb4e049dc337e82237c9644399716a8/c
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 -o source/qrcodegen.c $B/qrcodegen.c
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 -o source/qrcodegen.h $B/qrcodegen.h
          echo "6a2b9cc65176f2345dde260c74b6d352627e8a0a6385d086ae0e9c5d0913c70c  source/qrcodegen.c" | sha256sum -c -
          echo "e82df4bff37d18b5863b9e7486fe6bda1b6cda8c3b9ecebfec473907265cb589  source/qrcodegen.h" | sha256sum -c -

      # Reseau plus rapide : la pile reseau de libogc (meme version que celle
      # installee) est recompilee avec une fenetre TCP de 16 paquets au lieu
      # d'un seul. En cas de souci, cette etape est ignoree (reseau normal).
      - name: Préparer le réseau rapide
        continue-on-error: true
        run: |
          H="$DEVKITPRO/libogc/include/ogc/libversion.h"
          V=$(awk '/define[ \t]+_V_MAJOR_/{a=$3} /define[ \t]+_V_MINOR_/{b=$3} /define[ \t]+_V_PATCH_/{c=$3} END{print a"."b"."c}' "$H")
          echo "libogc installee : $V"
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 -o libogc.tar.gz \
            "https://github.com/devkitPro/libogc/archive/refs/tags/v$V.tar.gz"
          python3 tools/fast_net.py libogc.tar.gz

      # Certificats racines pour les sites https:// (liste Mozilla)
      - name: Générer source/cacert.h
        run: |
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 \
            -o cacert.pem https://curl.se/ca/cacert.pem \
            || cp /etc/ssl/certs/ca-certificates.crt cacert.pem
          python3 tools/pem2h.py cacert.pem source/cacert.h

      - name: Compiler
        shell: bash
        run: |
          make clean
          set -o pipefail
          make -j"$(nproc)" BUILD_NUM=${{ github.run_number }} 2>&1 | tee make.log || { grep -E "error|Error|undefined|\*\*\*" make.log | head -30 | sed 's/^/::error::/'; exit 1; }

      # Swiss lit les DOL par blocs de 128 Kio : on complete le fichier
      # jusqu'a un bloc entier (le chargeur ignore ces octets).
      - name: Aligner le DOL sur les blocs de lecture Swiss
        run: |
          python3 - <<'PY'
          import os
          path = "gc-mp3player.dol"
          block = 131072
          if not os.path.isfile(path):
              raise SystemExit("ERREUR: DOL absent")
          size = os.path.getsize(path)
          if size < 0x100:
              raise SystemExit("ERREUR: DOL trop petit")
          padded = ((size + block - 1) // block) * block
          with open(path, "ab") as f:
              f.write(b"\0" * (padded - size))
          print("DOL aligne:", size, "->", padded)
          PY

      - name: Vérifier le DOL généré
        run: |
          python3 - <<'PY'
          import struct, sys
          data = open("gc-mp3player.dol", "rb").read()
          size = len(data)
          if size < 0x100 or size % 131072:
              sys.exit("ERREUR: taille DOL invalide")
          def u(fmt, off):
              return struct.unpack_from(fmt, data, off)
          t_off, d_off = u(">7I", 0x00), u(">11I", 0x1C)
          t_adr, d_adr = u(">7I", 0x48), u(">11I", 0x64)
          t_len, d_len = u(">7I", 0x90), u(">11I", 0xAC)
          entry = u(">3I", 0xD8)[2]
          secs = []
          groups = (("text", t_off, t_adr, t_len),
                    ("data", d_off, d_adr, d_len))
          for kind, offs, adrs, lens in groups:
              for i in range(len(offs)):
                  off, adr, n = offs[i], adrs[i], lens[i]
                  if n == 0:
                      continue
                  if off < 0x100 or off + n > size:
                      sys.exit("ERREUR: section hors fichier")
                  if off % 4 or adr % 4 or n % 4:
                      sys.exit("ERREUR: section non alignee")
                  if adr < 0x80000000 or adr + n > 0x81800000:
                      sys.exit("ERREUR: section hors memoire")
                  secs.append((kind, adr, adr + n))
          if not secs:
              sys.exit("ERREUR: aucune section")
          ok = [s for s in secs if s[0] == "text"]
          if not any(a <= entry < b for k, a, b in ok):
              sys.exit("ERREUR: point d'entree invalide")
          secs.sort(key=lambda s: s[1])
          for a, b in zip(secs, secs[1:]):
              if a[2] > b[1]:
                  sys.exit("ERREUR: sections qui se chevauchent")
          print("DOL valide:", size, "octets,", len(secs), "sections")
          PY

      - name: Récupérer le lanceur de jeux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gc-mp3-loader
          path: loader

      # v45 : le retour en jeu porte le numero de ce build (GC-MP3 le met a jour)
      - name: Numéroter le fichier du retour en jeu
        if: ${{ hashFiles('loader/gc-mp3-igr.img') != '' }}
        run: |
          python3 - <<'PY'
          import struct
          p = "loader/gc-mp3-igr.img"
          d = bytearray(open(p, "rb").read())
          d[0:16] = struct.pack("16s", ("*gc-mp3-b%s" % "${{ github.run_number }}").encode())
          open(p, "wb").write(d)
          print("retour en jeu :", len(d), "octets")
          PY

      - name: Publier le .dol
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3player
          path: |
            gc-mp3player.dol
            loader/gc-mp3-igr.img

      # Mise a jour en un clic : le .dol va dans la release "dernier" du depot,
      # que GC-MP3 consulte (START > Mise a jour)
      - name: Publier la mise à jour (release « dernier »)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_release.py gc-mp3player.dol ${{ github.run_number }} loader/gc-mp3-igr.img loader/gc-mp3-loader.bin
