name: Compiler GC MP3 Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger minimp3.h
        run: |
          mkdir -p source
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h \
            --output source/minimp3.h
          test -s source/minimp3.h

      - name: Nettoyer et compiler
        run: |
          make clean
          make
          test -s gc-mp3player.dol

      - name: Vérifier la structure DOL
        run: |
          python3 - <<'PY'
          import os, struct, sys
          p = 'gc-mp3player.dol'
          b = open(p, 'rb').read()
          if len(b) < 0x100:
              sys.exit(f'DOL trop petit: {len(b)} octets')
          u32 = lambda off: struct.unpack_from('>I', b, off)[0]
          text_off = [u32(i*4) for i in range(7)]
          data_off = [u32(0x1c+i*4) for i in range(11)]
          text_addr = [u32(0x48+i*4) for i in range(7)]
          data_addr = [u32(0x64+i*4) for i in range(11)]
          text_sz = [u32(0x90+i*4) for i in range(7)]
          data_sz = [u32(0xac+i*4) for i in range(11)]
          entry = u32(0xe0)
          sections = []
          for kind, offs, addrs, sizes in [('text', text_off, text_addr, text_sz), ('data', data_off, data_addr, data_sz)]:
              for o, a, s in zip(offs, addrs, sizes):
                  if s == 0:
                      continue
                  if o < 0x100 or o + s > len(b):
                      sys.exit(f'Section {kind} invalide: offset={o:#x}, taille={s:#x}, fichier={len(b):#x}')
                  if o % 4 or a % 4:
                      sys.exit(f'Section {kind} non alignée: offset={o:#x}, adresse={a:#x}')
                  sections.append((kind, o, a, s))
          if not any(k == 'text' and a <= entry < a+s for k,o,a,s in sections):
              sys.exit(f'Point d’entrée {entry:#x} hors de toutes les sections texte')
          print(f'DOL structurellement cohérent: {len(b)} octets; entrée={entry:#010x}; sections={len(sections)}')
          for k,o,a,s in sections:
              print(f'  {k}: fichier={o:#x} adresse={a:#x} taille={s:#x}')
          PY

      - name: Publier le DOL
        uses: actions/upload-artifact@v4
        with:
          name: gc-mp3player
          path: gc-mp3player.dol
          if-no-files-found: error
