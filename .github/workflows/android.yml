name: Telecommande Android

# Application Android "GC Station" (telecommande : page du telephone de la console en plein ecran).
# Compilee quand le dossier android/ change ; l'APK est seulement joint a la compilation (pas de release publique).
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Cle de test d'Android (~/.android/debug.keystore, creee par les outils Android) gardee dans le cache :
      # une nouvelle version s'installe par-dessus l'ancienne (si aucune compilation pendant 7 jours : reinstaller).
      - name: Cle de test d'Android (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compiler l'APK
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk gc-station-telecommande.apk
          ls -la gc-station-telecommande.apk

      # Appli gardee pour soi : jamais dans une release publique. L'APK est seulement joint a la compilation
      # (onglet Actions > "Telecommande Android" > la derniere compilation > Artifacts), et efface au bout de 7 jours.
      - name: Joindre l'APK a la compilation
        uses: actions/upload-artifact@v4
        with:
          name: gc-station-telecommande
          path: gc-station-telecommande.apk
          retention-days: 7
