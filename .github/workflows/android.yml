name: Telecommande Android

# Application Android "GC Station" (telecommande : page du telephone de la console en plein ecran).
# Compilee quand le dossier android/ change ; l'APK est seulement joint a la compilation (pas de release publique).
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  # (tous les 5 jours : relit la cle de signature pour que GitHub ne l'efface pas de son cache apres 7 jours)
  schedule:
    - cron: '23 4 */5 * *'

permissions:
  contents: read

jobs:
  # la cle reste dans le cache (sinon : nouvelle cle, et l'APK suivant ne s'installerait plus par-dessus)
  garder-cle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          fail-on-cache-miss: false

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Cle de test d'Android (~/.android/debug.keystore, creee par les outils Android) gardee dans le cache :
      # une nouvelle version s'installe par-dessus l'ancienne (si aucune compilation pendant 7 jours : reinstaller).
      - name: Cle de test d'Android (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compiler l'APK
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk gc-station-telecommande.apk
          ls -la gc-station-telecommande.apk

      # Meme signature que les versions d'avant (android/signature.txt : empreinte publique du certificat) : sinon
      # Android refuserait la mise a jour par-dessus. Une autre signature = echec, plutot qu'un APK qui ne s'installe pas.
      - name: Verifier la signature (mise a jour par-dessus)
        run: |
          fp=$(keytool -printcert -jarfile gc-station-telecommande.apk | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "::notice title=Empreinte de la signature::$fp"
          if [ -f android/signature.txt ]; then
            want=$(grep -v '^#' android/signature.txt | tr -d ' \r\n')
            if [ "$want" != "$(echo "$fp" | tr -d ' ')" ]; then
              echo "::error::Signature differente de android/signature.txt : cet APK ne s'installerait pas par-dessus l'appli deja installee"
              exit 1
            fi
          fi

      # Appli gardee pour soi : jamais dans une release publique. L'APK est seulement joint a la compilation
      # (onglet Actions > "Telecommande Android" > la derniere compilation > Artifacts), et efface au bout de 7 jours.
      - name: Joindre l'APK a la compilation
        uses: actions/upload-artifact@v4
        with:
          name: gc-station-telecommande
          path: gc-station-telecommande.apk
          retention-days: 7
