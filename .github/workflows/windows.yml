name: GC Station PC (Windows)

# v356 : GC Station pour PC Windows (pc/ : sa propre copie du code, a part de la console) : le vrai code de GC Station dans une fenetre, clavier ou
# manette, son, Salon par Internet, et les jeux dans Dolphin (jeu en reseau local par Internet). Compile depuis Linux
# (MinGW 32 bits), essaye sur un vrai Windows (demarrage, fenetre, Salon par Internet, deux GC Station PC avec un faux
# Dolphin). Gardee pour soi, comme l'appli : jamais dans une release publique ; GC-Station-PC.zip est seulement joint a
# la compilation (onglet Actions > "GC Station PC (Windows)" > la derniere compilation > Artifacts, 90 jours).
# Seulement quand GC Station ou sa partie PC changent.
on:
  push:
    branches: [main, 'pc-*']              # (et les branches de la version PC : essais avant publication)
    paths:
      - 'pc/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read                    # (essai de la mise a jour : la derniere compilation et son fichier)

concurrency:
  group: gc-station-pc-${{ github.ref }}   # (une branche d'essai n'arrete plus la compilation de main)
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Outils (MinGW 32 bits, clang)
        run: |
          # (miroir d'Ubuntu parfois bloque : 3 essais de 8 min au plus)
          ok=0
          for i in 1 2 3; do
            # (un fichier bloque sur le miroir : abandonne apres 30 s et redemande, au lieu de 8 min pour rien)
            A="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            timeout 600 sudo apt-get $A update -q && timeout 900 sudo apt-get $A install -y -q --no-install-recommends clang lld llvm gcc-mingw-w64-i686 g++-mingw-w64-i686 zip >/dev/null && { ok=1; break; }
            echo "apt : nouvel essai"; sleep 10
          done
          [ $ok = 1 ] || { echo "apt : les outils n'ont pas pu etre installes (miroir d'Ubuntu)"; exit 1; }
          # (threads POSIX : la variante "posix" de MinGW, avec winpthreads)
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix || true

      - name: Bibliothèques (en cache)
        uses: actions/cache@v4
        with:
          path: |
            pc/work/src
            pc/work/libs
          key: pc-libs-${{ hashFiles('pc/fetch.sh') }}

      - name: Compiler
        run: |
          [ -d pc/work/libs/mbedtls ] || sh pc/fetch.sh
          make -C pc -j"$(nproc)" BUILD=${{ github.run_number }} 2>&1 | grep -v "^i686-w64-mingw32-g" || true
          test -s pc/work/gcstation.exe

      - name: Paquet
        run: |
          mkdir -p paquet/sd
          i686-w64-mingw32-strip -o "paquet/GC Station.exe" pc/work/gcstation.exe   # (sans les symboles : plus petit)
          cp pc/win/LISEZMOI.txt paquet/
          cd paquet && zip -q -r ../GC-Station-PC.zip . && cd ..
          ls -la GC-Station-PC.zip

      - name: Pour l'essai (faux Dolphin, faux jeu)
        run: |
          mkdir -p kit
          i686-w64-mingw32-gcc -O2 -o kit/Dolphin.exe pc/win/faux-dolphin.c -lws2_32 -static
          printf '\x60\x00\x00\x00' > kit/t.bin
          python3 -I pc/outils/mkiso.py kit/t.bin kit/test.iso
          rm kit/t.bin

      - uses: actions/upload-artifact@v4
        with:
          name: gc-station-pc
          path: GC-Station-PC.zip
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: gc-station-pc-symboles
          path: pc/work/gcstation.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: kit-essai
          path: kit
          retention-days: 3

  essayer:
    needs: compiler
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gc-station-pc
      - name: Essai (scenario, sans fenetre)
        shell: pwsh
        run: |
          Expand-Archive GC-Station-PC.zip -DestinationPath essai
          $env:PCSIM_SCRIPT = "$pwd\pc\win\essai.txt"
          $env:PCSIM_OUT = "$pwd\essai\captures"
          $env:PCSIM_LOG = "$pwd\essai\journal.txt"
          New-Item -ItemType Directory -Force essai\captures | Out-Null
          $p = Start-Process -FilePath "essai\GC Station.exe" -PassThru -Wait
          Write-Host "code de sortie : $($p.ExitCode)"
          Get-Content essai\journal.txt -Tail 40
          $n = (Get-ChildItem essai\captures\*.png).Count
          Write-Host "captures : $n"
          if ($p.ExitCode -ne 0 -or $n -lt 3) { exit 1 }
          # images pas noires : luminosite moyenne de chaque capture
          Add-Type -AssemblyName System.Drawing
          foreach ($f in Get-ChildItem essai\captures\*.png) {
            $b = [System.Drawing.Bitmap]::FromFile($f.FullName); $s = 0; $k = 0
            for ($y = 0; $y -lt $b.Height; $y += 8) { for ($x = 0; $x -lt $b.Width; $x += 8) { $c = $b.GetPixel($x, $y); $s += $c.R + $c.G + $c.B; $k++ } }
            $m = [math]::Round($s / (3 * $k), 1); $b.Dispose()
            Write-Host "$($f.Name) : luminosite moyenne $m"
            if ($m -lt 3) { Write-Host "image noire"; exit 1 }
          }
      - name: Essai (vraie fenetre, 12 s)
        shell: pwsh
        run: |
          Remove-Item Env:PCSIM_SCRIPT -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "essai\GC Station.exe" -PassThru
          Start-Sleep -Seconds 12
          $vivant = -not $p.HasExited
          if ($vivant) { Stop-Process -Id $p.Id -Force }
          Get-Content essai\journal.txt -Tail 15
          Write-Host "toujours en marche apres 12 s : $vivant"
          if (-not $vivant) { exit 1 }
      - name: Essai (souris, molette, clavier qui tape, touches multimedia)
        shell: pwsh
        run: |
          Remove-Item Env:PCSIM_SCRIPT -ErrorAction SilentlyContinue
          $env:GCSTATION_ESSAI_ENTREES = "1"
          Add-Type -Namespace W -Name U -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool PostMessageW(System.IntPtr h, uint m, System.IntPtr w, System.IntPtr l);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr h);
          [DllImport("user32.dll")] public static extern bool GetClientRect(System.IntPtr h, out RECT r);
          public struct RECT { public int l, t, r, b; }
          '@
          $p = Start-Process -FilePath "essai\GC Station.exe" -PassThru
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 40 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 250; $p.Refresh(); $h = $p.MainWindowHandle }
          if ($h -eq [IntPtr]::Zero) { Write-Host "pas de fenetre"; exit 1 }
          [W.U]::SetForegroundWindow($h) | Out-Null
          Start-Sleep -Seconds 8
          $r = New-Object W.U+RECT; [W.U]::GetClientRect($h, [ref]$r) | Out-Null
          $cx = [int](($r.r - $r.l) / 2); $cy = [int](($r.b - $r.t) / 2)
          # (comme un vrai clavier : touche enfoncee lParam = 1, relachee = bits 30 et 31 ; avec 0, Windows prend le relachement pour un appui)
          function K($vk) { M 0x0100 $vk 1; M 0x0101 $vk ([int]-1073741823) }
          function M($msg, $w, $l) { [W.U]::PostMessageW($h, $msg, [IntPtr]$w, [IntPtr]$l) | Out-Null; Start-Sleep -Milliseconds 120 }
          function Etat { try { Invoke-RestMethod -TimeoutSec 5 "http://127.0.0.1:8080/api/state" } catch { $null } }
          M 0x0204 2 (($cy -shl 16) -bor $cx)                       # clic droit (B : ferme le guide)
          Start-Sleep -Seconds 2
          M 0x0100 0x11 1; K 0x46; M 0x0101 0x11 ([int]-1073741823)   # Ctrl + F : recherche (onglet MUSIQUE)
          Start-Sleep -Seconds 1
          foreach ($c in 0xC9, 0x74, 0xE9, 0x7A) { M 0x0102 $c 0 }  # "Etez", accents compris (WM_CHAR)
          K 0x08                                                     # Retour arriere : efface le z
          Start-Sleep -Seconds 1
          $e1 = Etat
          Write-Host "clavier ouvert : $($e1.kb) ; texte : '$($e1.kbt)'"
          K 0x1B                                                     # Echap : ferme le clavier
          Start-Sleep -Seconds 1
          $e2 = Etat
          M 0x0200 0 ((($cy - 40) -shl 16) -bor ($cx - 60))         # la souris bouge
          M 0x0201 1 ((($cy - 40) -shl 16) -bor ($cx - 60))         # clic gauche (A)
          M 0x020A ((-120) -shl 16) ((($cy) -shl 16) -bor $cx)      # molette vers le bas
          M 0x0319 0 (14 -shl 16)                                   # touche lecture / pause (WM_APPCOMMAND)
          Start-Sleep -Seconds 3
          $vivant = -not $p.HasExited
          if ($vivant) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 1
          $j = Get-Content essai\journal.txt
          $j | Select-String "\[entrees\]|\[plantage\]" | ForEach-Object { Write-Host $_.Line }
          $ok = $vivant
          if ($e1.kb -ne 1) { Write-Host "ERREUR : Ctrl + F n'a pas ouvert le clavier"; $ok = $false }
          if ($e1.kbt -cne ([string][char]0xC9 + "t" + [char]0xE9)) { Write-Host "ERREUR : texte tape faux"; $ok = $false }
          if ($e2 -and $e2.kb) { Write-Host "ERREUR : Echap n'a pas ferme le clavier"; $ok = $false }
          foreach ($m in "souris", "clic", "molette -1", "multimedia", "zone de texte 1", "zone de texte 0") {
            if (-not ($j | Select-String -SimpleMatch "[entrees] $m")) { Write-Host "ERREUR : rien pour '$m'"; $ok = $false }
          }
          Write-Host "toujours en marche : $vivant"
          if (-not $ok) { exit 1 }
      - name: Essai (Salon par Internet, avec une fausse console)
        shell: pwsh
        run: |
          $env:GCS_BIN = "$pwd\essai\GC Station.exe"
          python pc/essais/salon-internet/test.py
          if ($LASTEXITCODE -ne 0) { Get-Content pc\work\salon-internet\journal-pc.txt -Tail 30; exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: kit-essai
          path: kit
      - name: Essai (deux GC Station PC, un jeu lance dans Dolphin, reseau local par Internet)
        shell: pwsh
        run: |
          # A heberge (sans adresse), B a l'adresse de A (127.0.0.1) ; meme code ; chacun son faux Dolphin
          foreach ($c in "a", "b") {
            New-Item -ItemType Directory -Force "deux\$c\sd\games", "deux\$c\sd\gc-mp3", "deux\$c\Dolphin", "deux\$c\captures" | Out-Null
            Copy-Item "essai\GC Station.exe" "deux\$c\"
            Copy-Item kit\Dolphin.exe "deux\$c\Dolphin\"
            Copy-Item kit\test.iso "deux\$c\sd\games\"
          }
          Set-Content -Encoding ascii deux\a\sd\gc-mp3\gc-mp3.txt "salon = oui`nsalon_code = essai-ci`n"
          Set-Content -Encoding ascii deux\b\sd\gc-mp3\gc-mp3.txt "salon = oui`nsalon_code = essai-ci`nsalon_ami = 127.0.0.1`n"
          $env:PCSIM_SCRIPT = "$pwd\pc\win\essai-jeu.txt"
          $env:PCSIM_OUT = "$pwd\deux\a\captures"; $env:PCSIM_LOG = "$pwd\deux\a\journal.txt"
          $pa = Start-Process -FilePath "deux\a\GC Station.exe" -PassThru
          Start-Sleep -Seconds 2
          $env:PCSIM_OUT = "$pwd\deux\b\captures"; $env:PCSIM_LOG = "$pwd\deux\b\journal.txt"
          $env:GCSTATION_TAPPORT = "51251"; $env:GCSTATION_LANPORT = "51250"; $env:GCSTATION_AMIPORT = "51240"
          $pb = Start-Process -FilePath "deux\b\GC Station.exe" -PassThru
          $t0 = Get-Date
          $pa.WaitForExit(120000) | Out-Null; $pb.WaitForExit(120000) | Out-Null
          Write-Host "fini apres $([math]::Round(((Get-Date) - $t0).TotalSeconds)) s ; codes de sortie : $($pa.ExitCode) $($pb.ExitCode)"
          Start-Sleep -Seconds 3
          $ok = $true
          foreach ($c in "a", "b") {
            Write-Host "===== GC Station $c ====="
            if (Test-Path "deux\$c\journal.txt") { Get-Content "deux\$c\journal.txt" -Tail 30 } else { Write-Host "(pas de journal)" }
            Get-ChildItem -Recurse "deux\$c" | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName.Substring($pwd.Path.Length))" }
            $r = "deux\$c\Dolphin\resultat.txt"
            if (Test-Path $r) { Get-Content $r; $t = Get-Content $r -Raw
              if ($t -notmatch "connecte=1") { $ok = $false; Write-Host "RATE : Dolphin $c pas branche a GC Station" }
              if ($t -notmatch "test\.iso") { $ok = $false; Write-Host "RATE : Dolphin $c sans le jeu" }
              if ($t -match "de_l_autre=(\d+)") { if ([int]$matches[1] -lt 100) { $ok = $false; Write-Host "RATE : Dolphin $c : trames de l'autre cote : $($matches[1])" } }
            } else { $ok = $false; Write-Host "RATE : Dolphin $c pas lance" }
          }
          if (-not $ok) { exit 1 }
          Write-Host "OK : deux GC Station PC, jeu lance dans Dolphin, trames echangees"
      - name: Essai (mise a jour depuis GitHub, avec un jeton)
        shell: pwsh
        env:
          GCSTATION_JETON: ${{ secrets.GITHUB_TOKEN }}
          GCSTATION_MAJ_ESSAI: "1"
          GCSTATION_MAJ_BRANCHE: main
        run: |
          $env:PCSIM_SCRIPT = "$pwd\pc\win\essai-maj.txt"; $env:PCSIM_OUT = "$pwd\maj"; $env:PCSIM_LOG = "$pwd\maj\journal.txt"
          New-Item -ItemType Directory -Force maj | Out-Null
          $p = Start-Process -FilePath "essai\GC Station.exe" -PassThru -Wait
          $j = Get-Content maj\journal.txt -Raw
          Get-Content maj\journal.txt | Select-String "\[maj\]"
          if ($j -match "nouvelle version telechargee et lisible") { Write-Host "OK : mise a jour telechargee, decompressee, lisible" }
          elseif ($j -match "derniere compilation : 0") { Write-Host "::warning::pas encore de compilation reussie sur cette branche : mise a jour pas essayee" }
          else { Write-Host "RATE : mise a jour"; exit 1 }
      - name: Essai (mise a jour qui remplace vraiment le programme en marche)
        shell: pwsh
        env:
          GCSTATION_JETON: ${{ secrets.GITHUB_TOKEN }}
          GCSTATION_MAJ_ESSAI: "remplacer"
          GCSTATION_MAJ_BRANCHE: main
        run: |
          New-Item -ItemType Directory -Force remp | Out-Null
          Copy-Item "essai\GC Station.exe" "remp\"
          $avant = (Get-Item "remp\GC Station.exe").Length
          $env:PCSIM_SCRIPT = "$pwd\pc\win\essai-maj.txt"; $env:PCSIM_OUT = "$pwd\remp"; $env:PCSIM_LOG = "$pwd\remp\journal.txt"
          $env:GCSTATION_MAJ_SUITE = "$pwd\pc\win\essai.txt"; $env:GCSTATION_MAJ_SUITE_LOG = "$pwd\remp\journal-nouveau.txt"
          $p = Start-Process -FilePath "remp\GC Station.exe" -PassThru -Wait
          Start-Sleep -Seconds 25
          Get-Content remp\journal.txt | Select-String "\[maj\]"
          if (Test-Path remp\journal-nouveau.txt) { Get-Content remp\journal-nouveau.txt | Select-String "\[maj\]|capture" }
          Get-ChildItem remp | ForEach-Object { Write-Host "  $($_.Name) $($_.Length)" }
          $apres = (Get-Item "remp\GC Station.exe").Length
          $j = if (Test-Path remp\journal-nouveau.txt) { Get-Content remp\journal-nouveau.txt -Raw } else { "" }
          $anciens = @(Get-ChildItem "remp\GC Station.exe.ancien*" -ErrorAction SilentlyContinue).Count
          $warn = (Get-Content remp\journal.txt -Raw) -match "derniere compilation : 0"
          if ($warn) { Write-Host "::warning::pas de compilation reussie sur cette branche : remplacement pas essaye"; exit 0 }
          # (la version telechargee est celle de main : l'effacement de l'ancien fichier se fait par la version qui a ce code,
          #  essaye juste apres avec ce programme-ci)
          if ($apres -ne $avant -and $j -match "capture") { Write-Host "OK : programme remplace pendant qu'il tournait ($avant -> $apres octets), la nouvelle version a demarre" }
          else { Write-Host "RATE : remplacement (avant $avant, apres $apres)"; exit 1 }
          # effacement de l'ancien fichier au demarrage (ce programme-ci)
          Remove-Item Env:GCSTATION_MAJ_ESSAI
          Copy-Item "essai\GC Station.exe" "remp\GC Station.exe" -Force
          $env:PCSIM_SCRIPT = "$pwd\pc\win\essai.txt"; $env:PCSIM_LOG = "$pwd\remp\journal-3.txt"
          $p = Start-Process -FilePath "remp\GC Station.exe" -ArgumentList "--apres-maj","1" -PassThru -Wait
          Get-Content remp\journal-3.txt | Select-String "\[maj\]"
          $anciens = @(Get-ChildItem "remp\GC Station.exe.ancien*" -ErrorAction SilentlyContinue).Count
          if ($anciens -eq 0) { Write-Host "OK : l'ancien programme est efface au demarrage" } else { Write-Host "RATE : ancien programme pas efface"; exit 1 }
      - name: Plantages (pour les symboles)
        if: always()
        shell: pwsh
        run: |
          $l = Get-ChildItem -Recurse -Include journal*.txt -Path essai, deux, maj, pc\work\salon-internet -ErrorAction SilentlyContinue | Select-String "\[plantage\]" | ForEach-Object { $_.Line }
          if ($l) { $l | Set-Content plantages.txt; $l } else { "" | Set-Content plantages.txt }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plantages
          path: plantages.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-deux-pc
          path: deux/*/captures
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-windows
          path: |
            essai/captures
            essai/journal.txt
          retention-days: 7

  # en cas de plantage sur Windows : les adresses de la pile -> fonctions et lignes du code (addr2line)
  symboles:
    needs: [compiler, essayer]
    if: always() && needs.compiler.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gc-station-pc-symboles
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: plantages
      - name: Ou ca a plante
        run: |
          sudo apt-get install -y -q binutils-mingw-w64-i686 >/dev/null 2>&1 || true
          [ -s plantages.txt ] && grep -q "pile" plantages.txt || { echo "aucun plantage"; exit 0; }
          cat plantages.txt
          B=$(i686-w64-mingw32-objdump -p gcstation.exe | awk '/ImageBase/ {print $2}')
          grep "pile" plantages.txt | grep -o "+[0-9A-F]\{8\}" | sort -u | while read a; do
            v=$(printf "0x%X" $(( 0x$B + 0x${a#+} )))
            echo "== $a"; i686-w64-mingw32-addr2line -f -i -C -e gcstation.exe $v | paste - - | head -4
          done
