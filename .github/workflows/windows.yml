name: GC Station PC (Windows)

# v345 : GC Station pour PC Windows (tools/pc-sim + win/) : le vrai code de GC Station dans une fenetre, clavier ou
# manette, son, Salon par Internet, et les jeux dans Dolphin (jeu en reseau local par Internet). Compile depuis Linux
# (MinGW 32 bits), essaye sur un vrai Windows (scenario : demarrage, onglets, captures), puis publie dans la release
# "gc-station-pc" (GC-Station-PC.zip). Seulement quand GC Station ou sa partie PC changent.
on:
  push:
    branches: [main, salon-internet]
    paths:
      - 'source/**'
      - '!source/natres/**'
      - 'tools/pc-sim/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gc-station-pc
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Outils (MinGW 32 bits, clang)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm gcc-mingw-w64-i686 g++-mingw-w64-i686 zip >/dev/null
          # (threads POSIX : la variante "posix" de MinGW, avec winpthreads)
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix || true

      - name: Bibliothèques (en cache)
        uses: actions/cache@v4
        with:
          path: |
            tools/pc-sim/work/src
            tools/pc-sim/work/libs
          key: pcsim-libs-${{ hashFiles('tools/pc-sim/fetch.sh') }}

      - name: Compiler
        run: |
          [ -d tools/pc-sim/work/libs/mbedtls ] || sh tools/pc-sim/fetch.sh
          make -s -C tools/pc-sim gen
          make -C tools/pc-sim -f win/Makefile -j"$(nproc)" BUILD=${{ github.run_number }} 2>&1 | grep -v "^i686-w64-mingw32-g" || true
          test -s tools/pc-sim/work/gcstation.exe

      - name: Paquet
        run: |
          mkdir -p paquet/sd
          cp tools/pc-sim/work/gcstation.exe "paquet/GC Station.exe"
          cp tools/pc-sim/win/LISEZMOI.txt paquet/
          cd paquet && zip -q -r ../GC-Station-PC.zip . && cd ..
          ls -la GC-Station-PC.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gc-station-pc
          path: GC-Station-PC.zip
          retention-days: 14

  essayer:
    needs: compiler
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gc-station-pc
      - name: Essai (scenario, sans fenetre)
        shell: pwsh
        run: |
          Expand-Archive GC-Station-PC.zip -DestinationPath essai
          $env:PCSIM_SCRIPT = "$pwd\tools\pc-sim\win\essai.txt"
          $env:PCSIM_OUT = "$pwd\essai\captures"
          $env:PCSIM_LOG = "$pwd\essai\journal.txt"
          New-Item -ItemType Directory -Force essai\captures | Out-Null
          $p = Start-Process -FilePath "essai\GC Station.exe" -PassThru -Wait
          Write-Host "code de sortie : $($p.ExitCode)"
          Get-Content essai\journal.txt -Tail 40
          $n = (Get-ChildItem essai\captures\*.png).Count
          Write-Host "captures : $n"
          if ($p.ExitCode -ne 0 -or $n -lt 3) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-windows
          path: |
            essai/captures
            essai/journal.txt
          retention-days: 7

  publier:
    needs: essayer
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gc-station-pc
      - name: Release « gc-station-pc »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view gc-station-pc >/dev/null 2>&1 || gh release create gc-station-pc --title "GC Station PC (Windows)" --notes "GC Station pour PC Windows : dézipper, lancer « GC Station.exe ». Voir LISEZMOI.txt." --latest=false
          gh release upload gc-station-pc GC-Station-PC.zip --clobber
          gh release edit gc-station-pc --notes "GC Station pour PC Windows (build ${{ github.run_number }}) : dézipper, lancer « GC Station.exe ». Voir LISEZMOI.txt."
