// Telecommande GC Station : application Android. Ecrans en Jetpack Compose (Kotlin : StationActivity, App, Ecran*) ;
// reseau, en direct, lecture en fond, manette en jeu, globe, jeu de cartes, mini-jeux, widget : en Java.
// Compilee par GitLab (.gitlab-ci.yml, job manuel "appli", ci/appli.sh) ; numero de version = APPLI_BUILD de ci/numeros.env.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// (build 498 : identifiant de l'application Discord, voir la variante prive)
def DISCORD_ID = '1569385821276999721'

android {
    namespace 'fr.gcstation.telecommande'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.gcstation.telecommande'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('BUILD_NUM') ?: '1')
        versionName '1.' + (System.getenv('BUILD_NUM') ?: '0')
        // mise a jour depuis l'appli (AppUpdate) : compilation, branche et artefact de cette appli
        buildConfigField 'String', 'MAJ_WORKFLOW', '"android.yml"'
        buildConfigField 'String', 'MAJ_BRANCHE', '"main"'
        buildConfigField 'String', 'MAJ_PREFIXE', '""'
        buildConfigField 'String', 'MAJ_ARTEFACT', '"gc-station-telecommande"'
        buildConfigField 'String', 'MAJ_PAQUET', '""'
        // (agrandissement par IA de l'image du disque, ONNX Runtime : telephones ARM seulement, l'appli reste legere)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    // build 375 : emulateur GBA (mGBA, MPL 2.0, telecharge a la compilation) et son pont (src/main/cpp)
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    androidResources { noCompress 'onnx' }
    buildFeatures {
        compose true
        buildConfig true
    }
    // build 457 : deux variantes (choix du proprietaire, 7 novembre 2026) :
    //  - prive : l'appli complete du proprietaire (memes nom, identifiant et cle qu'avant : s'installe par-dessus) ;
    //  - publique : version allegee a diffuser (autre nom, autre identifiant, sa propre cle) ; les fonctions privees ne sont
    //    PAS dans son code : leurs fichiers sont dans src/prive/ (compiles seulement pour prive), src/publique/ donne a la
    //    place des remplacants vides ou la carte simplifiee faite maison (aucun fichier de jeu).
    signingConfigs {
        publique {
            // (cle de la version publique, a part : fichier donne par la variable ANDROID_PUBLIC_KEYSTORE_B64 de GitLab)
            def f = System.getenv('PUBLIC_KEYSTORE')
            if (f != null && new File(f).exists()) {
                storeFile new File(f)
                storePassword System.getenv('PUBLIC_KEYSTORE_PASS') ?: 'android'
                keyAlias System.getenv('PUBLIC_KEY_ALIAS') ?: 'gcremote'
                keyPassword System.getenv('PUBLIC_KEYSTORE_PASS') ?: 'android'
            }
        }
    }
    // (build 467 : la cle vient de la variante : sinon le type « debug » imposait la cle de test d'Android a la publique aussi)
    buildTypes { debug { signingConfig null } }
    flavorDimensions 'version'
    productFlavors {
        prive {
            dimension 'version'
            signingConfig signingConfigs.debug                      // (cle de test d'Android, gardee par GitLab : comme avant)
            buildConfigField 'boolean', 'PRIVE', 'true'
            // (build 559 : la cartouche dans la GBA du telephone (gba_jni.c) : compilee dans l'appli privee seulement)
            externalNativeBuild { cmake { cFlags '-DGCS_PRIVE' } }
            // (build 498 : presence Discord : identifiant de l'application GC Station du portail developpeur de Discord ;
            //  ce n'est pas un secret. Le SDK, lui, est dans libs-prive/, hors du depot.)
            buildConfigField 'long', 'DISCORD_ID', DISCORD_ID + 'L'
            manifestPlaceholders = [nomAppli: 'GC Remote', discordSchema: 'discord-' + DISCORD_ID]
        }
        publique {
            dimension 'version'
            applicationId 'fr.gcstation.remote'
            buildConfigField 'boolean', 'PRIVE', 'false'
            // (mise a jour : paquet generique public du projet, sans jeton)
            buildConfigField 'String', 'MAJ_PAQUET', '"appli-publique"'
            manifestPlaceholders = [nomAppli: 'GC Remote Lite']
            if (System.getenv('PUBLIC_KEYSTORE') != null) signingConfig signingConfigs.publique
        }
    }
    // (appli gardee pour soi : signee avec la cle de test d'Android, creee par les outils Android et gardee
    //  dans la variable protegee ANDROID_DEBUG_KEYSTORE_B64 de GitLab pour qu'une nouvelle version s'installe par-dessus)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'   // (Real-ESRGAN : AgrandirIA.kt)
    implementation 'com.google.mlkit:translate:17.0.3'                      // (traduction hors ligne : Traduction.kt)
    implementation 'com.google.mlkit:language-id:17.0.6'
    testImplementation 'junit:junit:4.13.2'                                 // (build 532 : essais sur le PC : RecolleDirectTest)
    // (build 498 : Social SDK de Discord pour la presence, appli privee seulement ; pas dans le depot, ajoute a la main)
    if (file('libs-prive/discord_partner_sdk.aar').exists()) priveImplementation files('libs-prive/discord_partner_sdk.aar')
}
