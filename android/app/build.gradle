// Telecommande GC Station : application Android (WebView sur la page du telephone de la console).
// Compilee par GitHub (.github/workflows/android.yml) ; numero de version = numero de la compilation.
plugins { id 'com.android.application' }

android {
    namespace 'fr.gcstation.telecommande'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.gcstation.telecommande'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('BUILD_NUM') ?: '1')
        versionName '1.' + (System.getenv('BUILD_NUM') ?: '0')
    }
    signingConfigs {
        release {
            // Cle de signature : jamais dans le depot. Fournie par la compilation (SIGN_STORE, SIGN_PASS) :
            // secrets du depot, sinon une cle gardee dans le cache de GitHub (voir .github/workflows/android.yml).
            if (System.getenv('SIGN_STORE')) {
                storeFile file(System.getenv('SIGN_STORE'))
                storePassword System.getenv('SIGN_PASS')
                keyAlias 'telecommande'
                keyPassword System.getenv('SIGN_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SIGN_STORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
